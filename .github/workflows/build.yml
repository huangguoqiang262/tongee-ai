name: Build Electron App

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.yml

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and notarize Electron app
        shell: bash
        run: |
          set -o pipefail
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            log_file="$(mktemp)"
            echo "Starting macOS build and notarization (attempt ${attempt}/${max_attempts})"

            if npm run build:mac 2>&1 | tee "$log_file"; then
              exit 0
            fi

            if ! grep -Eq 'NSURLErrorDomain Code=-1009|No network route|The Internet connection appears to be offline' "$log_file"; then
              echo "Build failed for a non-network reason; not retrying."
              exit 1
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Apple notarization remained unreachable after ${max_attempts} attempts."
              exit 1
            fi

            wait_seconds=$((attempt * 60))
            echo "Apple notarization was temporarily unreachable; retrying in ${wait_seconds}s."
            sleep "$wait_seconds"
          done
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.ASC_PROVIDER }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
