<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>糖吉AI</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta http-equiv="Access-Control-Allow-Origin" content="*" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="renderer" content="webkit" />
    <style>
      /* 加载动画样式 */
      .loading-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      /* .loading-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        animation: float 3s ease-in-out infinite;
      } */

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .loading-text {
        color: white;
        font-size: 18px;
        font-weight: 500;
        margin-top: 20px;
        text-align: center;
        font-family: 'Microsoft YaHei', sans-serif;
      }

      .loading-dots {
        display: inline-block;
        animation: dots 1.5s steps(4, end) infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      @keyframes dots {
        0%, 20% { color: rgba(255, 255, 255, 0); text-shadow: .25em 0 0 rgba(255, 255, 255, 0), .5em 0 0 rgba(255, 255, 255, 0); }
        40% { color: white; text-shadow: .25em 0 0 rgba(255, 255, 255, 0), .5em 0 0 rgba(255, 255, 255, 0); }
        60% { text-shadow: .25em 0 0 white, .5em 0 0 rgba(255, 255, 255, 0); }
        80%, 100% { text-shadow: .25em 0 0 white, .5em 0 0 white; }
      }

      .loading-hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* 进度条样式 */
      .loading-progress {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        margin-top: 15px;
        overflow: hidden;
      }

      .loading-progress-bar {
        height: 100%;
        background: white;
        border-radius: 2px;
        width: 0%;
        transition: width 0.3s ease;
      }
    </style>
  </head>

  <body>
    <!-- 加载动画容器 -->
    <div id="loading" class="loading-container">
      <!-- 可以使用您的logo图片，这里用文字代替 -->
      <!-- <div class="loading-logo">
        <svg viewBox="0 0 100 100" fill="white">
          <circle cx="50" cy="50" r="40" stroke="white" stroke-width="8" fill="none" />
          <path d="M30,50 L70,50 M50,30 L50,70" stroke="white" stroke-width="8" />
        </svg>
      </div> -->
      <div class="loading-spinner"></div>
      <div class="loading-text">
        糖吉AI 加载中<span class="loading-dots">...</span>
      </div>
      <div class="loading-progress">
        <div class="loading-progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <script>
      // 加载动画控制脚本
      window.addEventListener('DOMContentLoaded', () => {
        const loading = document.getElementById('loading');
        const progressBar = document.getElementById('progressBar');
        let progress = 0;

        // 模拟加载进度
        const progressInterval = setInterval(() => {
          progress += Math.random() * 10;
          if (progress > 90) progress = 90; // 保持在90%，等待实际加载完成
          progressBar.style.width = progress + '%';
        }, 200);
        // 备用方案：如果5秒后还没收到vue-app-ready事件，自动隐藏
        setTimeout(() => {
          clearInterval(progressInterval);
          loading.classList.add('loading-hidden');
          setTimeout(() => {
            loading.remove();
          }, 500);
        }, 5000);
      });
    </script>
  </body>
</html>
