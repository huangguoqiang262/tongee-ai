<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background: #EDEDED;
            padding: 20px;
        }

        .content-box {
          width: 570px;
          height: 368px;
          background: linear-gradient( 180deg, rgba(253,253,253,0) 0%, #F9F9F9 100%),
          url(../assets/notebook/share-long-img-bg.png) no-repeat top center/100% 100%;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 用户消息示例 -->
        <div class="message-row right">
            <div class="row">
                <div class="message message-user">
                    <div class="message-content">
                        <div class="markdown-content">
                            <p>你好，我想了解一些关于产品功能的信息。</p>
                        </div>
                        <div class="empty-message">2024-01-15 14:30:25</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI消息示例 -->
        <div class="message-row left">
            <div class="row">
                <div class="avatar-wrapper">
                    <div class="avatar"></div>
                    <span>糖源AI</span>
                </div>
                <div class="message">
                    <div class="message-content">
                        <div class="markdown-content">
                            <p>您好！很高兴为您服务。我们的产品主要功能包括：</p>
                            <ul>
                                <li>智能对话</li>
                                <li>文档处理</li>
                                <li>图像生成</li>
                                <li>数据分析</li>
                            </ul>
                            <p>请问您对哪个功能比较感兴趣？</p>
                        </div>

                        <!-- 附件示例 -->
                        <div class="attachment">
                            <div class="attach-item">
                                <img class="attached-icon" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiBmaWxsPSIjNDA5RUZGIi8+Cjx0ZXh0IHg9IjEyIiB5PSIxMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiIGZvbnQtc2l6ZT0iMTIiPkQ8L3RleHQ+Cjwvc3ZnPgo=" alt="文档图标">
                                <div class="attached-content">
                                    <div class="attach-name">产品功能介绍文档.pdf</div>
                                    <div class="attach-type">
                                        <span class="file-extension">PDF</span>
                                        <span class="file-size">2.5 MB</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 图片示例 -->
                        <div class="image-box">
                            <div class="image" style="background: #e0e0e0; display: flex; align-items: center; justify-content: center; color: #999;">
                                产品示意图
                            </div>
                        </div>
                        <!-- 问题建议示例 -->
                        <div class="question-box">
                            <div class="question-item">能详细介绍一下智能对话功能吗？</div>
                            <div class="question-item">文档处理支持哪些格式？</div>
                            <div class="question-item">图像生成的质量如何？</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据
        const mockData = {
            messages: [
                {
                    type: 'USER',
                    textContent: '你好，我想了解一些关于产品功能的信息。',
                    dateline: '2024-01-15 14:30:25',
                    direction: 'right'
                },
                {
                    type: 'AI',
                    textContent: '您好！很高兴为您服务。我们的产品主要功能包括：\n\n* 智能对话\n* 文档处理\n* 图像生成\n* 数据分析\n\n请问您对哪个功能比较感兴趣？',
                    reasoningContentText: '用户询问产品功能，需要提供清晰的功能列表和友好的交互引导。',
                    file_info: [
                        {
                            filename: '产品功能介绍文档.pdf',
                            total_space: 2560
                        }
                    ],
                    issueContentText: '能详细介绍一下智能对话功能吗？&&文档处理支持哪些格式？&&图像生成的质量如何？'
                }
            ]
        };

        // 简单的Markdown解析
        function parseMarkdown(text) {
            if (!text) return '';

            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n\* (.*?)(?=\n|$)/g, '<li>$1</li>')
                .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>')
                .replace(/^(.+)$/m, '<p>$1</p>');
        }

        // 渲染消息
        function renderMessages() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            mockData.messages.forEach(message => {
                const messageRow = document.createElement('div');
                messageRow.className = `message-row ${message.direction || 'left'}`;

                if (message.type === 'USER') {
                    messageRow.innerHTML = `
                        <div class="row">
                            <div class="message message-user">
                                <div class="message-content">
                                    <div class="markdown-content">${parseMarkdown(message.textContent)}</div>
                                    <div class="empty-message">${message.dateline || ''}</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    messageRow.innerHTML = `
                        <div class="row">
                            <div class="avatar-wrapper">
                                <div class="avatar"></div>
                                <span>糖源AI</span>
                            </div>
                            <div class="message">
                                <div class="message-content">
                                    ${message.reasoningContentText ? `
                                        <div class="reasoningContentText">
                                            <div class="reasoning-content">${message.reasoningContentText}</div>
                                        </div>
                                    ` : ''}

                                    <div class="markdown-content">${parseMarkdown(message.textContent)}</div>

                                    ${message.file_info && message.file_info.length ? `
                                        <div class="attachment">
                                            ${message.file_info.map(file => `
                                                <div class="attach-item">
                                                    <img class="attached-icon" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjI0IiBoZWlnaHQ9IjI0IiBmaWxsPSIjNDA5RUZGIi8+Cjx0ZXh0IHg9IjEyIiB5PSIxMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiIGZvbnQtc2l6ZT0iMTIiPkQ8L3RleHQ+Cjwvc3ZnPgo=" alt="文档图标">
                                                    <div class="attached-content">
                                                        <div class="attach-name">${file.filename}</div>
                                                        <div class="attach-type">
                                                            <span class="file-extension">${(file.filename?.split('.').pop() || 'FILE').toUpperCase()}</span>
                                                            ${file.total_space ? `<span class="file-size">${formatFileSize(file.total_space)}</span>` : ''}
                                                        </div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    ` : ''}

                                    <div class="empty-message download-message">
                                        <img class="chat-icon" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iOCIgY3k9IjgiIHI9IjciIGZpbGw9IiM2NjYiLz4KPC9zdmc+" alt="笔记">
                                        <img class="chat-icon" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiBmaWxsPSIjNjY2Ii8+Cjwvc3ZnPg==" alt="分享">
                                        <img class="chat-icon" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBvbHlnb24gcG9pbnRzPSI4LDIgMTQsMTQgMiwxNCIgZmlsbD0iIzY2NiIvPgo8L3N2Zz4=" alt="反馈">
                                    </div>

                                    ${message.issueContentText ? `
                                        <div class="question-box">
                                            ${message.issueContentText.split('&&').map(question => `
                                                <div class="question-item">${question}</div>
                                            `).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }

                app.appendChild(messageRow);
            });
        }

        // 文件大小格式化
        function formatFileSize(kb) {
            if (!kb) return '0 KB';
            if (kb < 1024) {
                return kb + ' KB';
            } else if (kb < 1024 * 1024) {
                return (kb / 1024).toFixed(2) + ' MB';
            } else {
                return (kb / (1024 * 1024)).toFixed(2) + ' GB';
            }
        }

        // 初始化渲染
        document.addEventListener('DOMContentLoaded', renderMessages);
    </script>
</body>
</html>
